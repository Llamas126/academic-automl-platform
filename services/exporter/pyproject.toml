[project]
name = "exporter"
version = "0.1.0"
description = "Academic AutoML - scientific bundle exporter service"
requires-python = ">=3.12"
dependencies = [
    "automl-shared",
    "celery==5.6.3",
    "jinja2==3.1.6",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "seaborn==0.13.2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exporter*"]

[tool.setuptools.package-data]
exporter = ["services/templates/*.j2"]