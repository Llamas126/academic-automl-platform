[project]
name = "inference"
version = "0.1.0"
description = "Academic AutoML - inference service"
requires-python = ">=3.12"
dependencies = [
    "automl-shared",
    "fastapi==0.141.1",
    "joblib==1.5.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "scikit-learn==1.9.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inference*"]
