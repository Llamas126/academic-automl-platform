[project]
name = "mlcore"
version = "0.1.0"
description = "Academic AutoML - ML core service (training orchestration)"
requires-python = ">=3.12"
dependencies = [
    "automl-shared",
    "celery==5.6.3",
    "fastapi==0.141.1",
    "joblib==1.5.3",
    "numpy==2.5.2",
    "optuna==4.9.0",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
explain = ["shap==0.52.0"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlcore*"]
