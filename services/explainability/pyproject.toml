[project]
name = "explainability"
version = "0.1.0"
description = "Academic AutoML - SHAP explainability service"
requires-python = ">=3.12"
dependencies = [
    "automl-shared",
    "celery==5.6.3",
    "joblib==1.5.3",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "scikit-learn==1.9.0",
    "shap==0.52.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["explainability*"]
