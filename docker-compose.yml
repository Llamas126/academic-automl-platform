services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    mem_limit: 256m
    cpus: 0.5
    networks:
      - automl

  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JOB_STORE_BACKEND: redis
      CELERY_EAGER: "false"
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - automl

  worker:
    build:
      context: .
      target: runtime
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JOB_STORE_BACKEND: redis
      CELERY_EAGER: "false"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: "2.0"
    networks:
      - automl

  beat:
    build:
      context: .
      target: runtime
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JOB_STORE_BACKEND: redis
      CELERY_EAGER: "false"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - automl

  tests:
    build:
      context: .
      target: test
    profiles:
      - test
    command: ["pytest", "tests", "-q"]
    environment:
      JOB_STORE_BACKEND: memory
      CELERY_EAGER: "true"
      DATA_DIR: /app/data
    restart: "no"
    healthcheck:
      disable: true
    networks:
      - automl

networks:
  automl:
    driver: bridge
