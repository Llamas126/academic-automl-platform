[project]
name = "academic-automl-platform"
version = "0.1.0"
description = "Async AutoML platform for scientific research and academic publication"
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
