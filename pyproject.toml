[project]
name = "academic-automl-platform"
version = "0.1.0"
description = "Async AutoML platform for scientific research and academic publication"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Juan Camilo Llamas Cárdenas", email = "juanc-llamasc@qbitsglobal.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Llamas126/academic-automl-platform"
Repository = "https://github.com/Llamas126/academic-automl-platform"
Issues = "https://github.com/Llamas126/academic-automl-platform/issues"
Contributing = "https://github.com/Llamas126/academic-automl-platform/blob/main/CONTRIBUTING.md"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/services/bibtex_service.py" = ["E501"]
"services/exporter/exporter/services/bibtex_service.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
